[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ascii-vision"
version = "0.1.0"
description = "A high-performance decoupled ASCII art converter and GUI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "PySide6>=6.0.0",
    "opencv-python-headless>=4.5.0",
    "numpy>=1.20.0",
    "pillow>=9.0.0",
    "jsonschema>=4.0.0",
    "platformdirs>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-benchmark>=4.0.0",
    "ruff>=0.1.0",
    "pytest-cov>=4.0.0",
    "pytest-qt>=4.0.0",
]
# PyAV-backed video decoding. Without it, OpenCV is used as a fallback.
video = [
    "av>=10.0.0",
]

[project.scripts]
ascii-vision = "ascii_vision.cli:main"

[project.gui-scripts]
ascii-vision-gui = "ascii_vision_gui.app:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["ascii_vision", "ascii_vision_gui"]

[tool.setuptools.package-data]
ascii_vision = ["config_schema.json", "assets/fonts/*"]

[tool.ruff.lint]
# Real defects only (syntax errors, undefined names, unused imports/variables).
# Style rules are intentionally off so lint stays a useful signal.
select = ["E9", "F"]
